:root{color-scheme:dark;
  --bg:#0a0a0a;--surface-1:#141414;--surface-2:#1c1c1c;--surface-3:#262626;--line:#262626;
  --fg:#ededed;--fg-2:#a3a3a3;--fg-3:#8a8a8a;--on-fg:#0a0a0a;--ok:#86efac;--warn:#fde047;--danger:#fca5a5;
  --shadow:0 18px 50px rgba(0,0,0,.38);--scrim:rgba(0,0,0,.6);
  --line-strong:color-mix(in srgb,var(--fg) 20%,transparent);
  --warn-line:color-mix(in srgb,var(--warn) 45%,transparent);
  --danger-line:color-mix(in srgb,var(--danger) 45%,transparent);
  --ok-line:color-mix(in srgb,var(--ok) 40%,transparent);
  --sans:"Inter","Noto Sans Thai",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --size-xs:12px;--size-sm:13px;--size-ui:14px;--size-chat:15px;--size-input:16px;--size-lg:18px;--size-xl:24px;--size-xxl:32px;
  --r-control:8px;--r-card:14px;--r-composer:24px;--r-pill:999px;--r-tail:4px;
  --motion-ui:160ms;--motion-panel:240ms;--motion-breath:4800ms;--motion-ceremony:1600ms;
  --press:.97;--chat-w:720px;--nav-w:264px;--rail-w:64px;--pane-w:520px;--pane-wide:720px;--hatch:repeating-linear-gradient(135deg,var(--fg-3) 0 2px,transparent 2px 5px)}
:root[data-theme=light]{color-scheme:light;
  --bg:#fafaf9;--surface-1:#ffffff;--surface-2:#f4f4f3;--surface-3:#ebebea;--line:#e7e7e5;
  --fg:#0a0a0a;--fg-2:#525252;--fg-3:#6b6b6b;--on-fg:#fafaf9;--ok:#15803d;--warn:#8f5706;--danger:#b91c1c;
  --shadow:0 18px 50px rgba(0,0,0,.08);--scrim:rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--surface-2);color:var(--fg);font:400 var(--size-ui)/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1{font-size:var(--size-xl);font-weight:600;letter-spacing:-.015em;line-height:1.3}
h2{font-size:var(--size-lg);font-weight:600;line-height:1.35}
h3{font-size:var(--size-ui);font-weight:600;line-height:1.4}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mono{font-family:var(--mono);font-size:var(--size-sm);overflow-wrap:anywhere}
.meta{color:var(--fg-3);font-size:var(--size-xs)}
.sub{color:var(--fg-2)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Prototype chrome: review tooling, deliberately outside the product. */
.chrome{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:var(--size-sm);flex:none}
.chrome-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px dashed var(--warn-line);border-radius:var(--r-pill);color:var(--warn);font-weight:500;white-space:nowrap}
.chrome-scene{display:flex;align-items:center;gap:4px;flex:1 1 280px;min-width:0}
.chrome select{flex:1;min-width:0;max-width:440px;height:32px;padding:0 8px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-control)}
.chrome .icon-btn{width:32px;height:32px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line-strong);border-radius:var(--r-control);overflow:hidden}
.seg button{height:30px;padding:0 10px;color:var(--fg-2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--on-fg);font-weight:500}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:0}
.stage[data-device=tablet],.stage[data-device=mobile]{padding:12px}
.viewport{width:100%;height:100%;container:app/inline-size;overflow:hidden;position:relative;background:var(--bg)}
.stage[data-device=tablet] .viewport{width:820px;max-width:100%;border:1px solid var(--line-strong);border-radius:var(--r-card)}
.stage[data-device=mobile] .viewport{width:390px;max-width:100%;max-height:844px;border:1px solid var(--line-strong);border-radius:var(--r-composer)}

/* Shell */
.app{position:relative;display:flex;height:100%;background:var(--bg);overflow:hidden}
.nav{width:var(--nav-w);flex:none;display:flex;flex-direction:column;gap:2px;padding:16px 12px 12px;background:var(--surface-1);border-right:1px solid var(--line);overflow-y:auto}
.lockup{display:flex;align-items:center;padding:0 8px 12px;min-height:44px}
.lockup svg{height:36px;width:auto;display:block}
.lockup .mark-only{display:none}
.nav-new{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-weight:500;margin-bottom:6px}
.nav-new:hover,.nav-link:hover{background:var(--surface-3)}
.nav-link{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 10px;border-radius:var(--r-control);color:var(--fg-2);text-align:left}
.nav-link[aria-current=page]{background:var(--surface-3);color:var(--fg);font-weight:500}
.nav-link .pill{margin-left:auto}
.nav-link kbd{margin-left:auto;font:400 var(--size-xs) var(--sans);border:1px solid var(--line-strong);border-radius:6px;padding:1px 5px;color:var(--fg-3)}
.nav-sec{padding:14px 10px 4px;color:var(--fg-3);font-size:var(--size-xs)}
.nav-bot{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:4px 10px;border-radius:var(--r-control);text-align:left}
.nav-bot:hover{background:var(--surface-3)}
.nav-bot small{display:block;color:var(--fg-3);font-size:var(--size-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-bot span.t{min-width:0;flex:1}
.nav-chat{display:block;width:100%;padding:6px 10px;border-radius:var(--r-control);color:var(--fg-2);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-chat:hover{background:var(--surface-3)}
.nav-chat[aria-current=page]{background:var(--surface-3);color:var(--fg)}
.nav-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 24px;border-bottom:1px solid var(--line);flex:none}
.hdr-t{min-width:0;flex:1}
.hdr-t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t small{display:block;color:var(--fg-3);font-size:var(--size-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-back{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.col{max-width:var(--chat-w);margin:0 auto;padding:24px}
.col.wide{max-width:960px}
.dock{flex:none;padding:8px 24px 16px;background:var(--bg)}
.dock>*{max-width:var(--chat-w);margin-inline:auto}
.tabs-bottom{display:none}
.scrim{display:none}

/* Pane */
.pane{width:var(--pane-w);flex:none;display:flex;flex-direction:column;background:var(--surface-1);border-left:1px solid var(--line);min-height:0}
.pane[data-wide=true]{width:var(--pane-wide)}
.pane-hdr{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;flex:none}
.pane-hdr .t{flex:1;min-width:0}
.pane-hdr .t b{display:block;font-weight:600;font-size:var(--size-chat);line-height:1.35}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.tabs button{position:relative;padding:8px 10px;color:var(--fg-2);white-space:nowrap;min-height:40px}
.tabs button[aria-selected=true]{color:var(--fg);font-weight:500}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--fg);border-radius:2px}
.pane-body{flex:1;min-height:0;overflow-y:auto;padding:16px}
.pane-foot{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-weight:500;text-align:center;transition:background var(--motion-ui) ease-out,transform var(--motion-ui) ease-out}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(var(--press))}
.btn.primary{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
.btn.primary:hover{background:var(--fg-2);border-color:var(--fg-2)}
.btn.danger{color:var(--danger);border-color:var(--danger-line)}
.btn.sm{min-height:32px;padding:4px 12px;font-size:var(--size-sm)}
.btn:disabled{color:var(--fg-3);background:none;border-color:var(--line);transform:none}
.btn.primary:disabled{background:var(--surface-3);color:var(--fg-2);border-color:var(--surface-3)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r-control);color:var(--fg-2);flex:none}
.icon-btn:hover{background:var(--surface-3);color:var(--fg)}
.link{text-decoration:underline;text-underline-offset:3px;color:var(--fg-2)}
.link:hover{color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:var(--size-xs);line-height:18px;white-space:nowrap;color:var(--fg-2);flex:none}
.pill.ok{color:var(--ok);border-color:var(--ok-line)}
.pill.warn{color:var(--warn);border-color:var(--warn-line)}
.pill.danger{color:var(--danger);border-color:var(--danger-line)}
.pill.strong{color:var(--fg);border-color:var(--line-strong)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.s4{gap:4px}.stack.s8{gap:8px}.stack.s16{gap:16px}.stack.s24{gap:24px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.pane .card{background:var(--bg)}
.card.flush{padding:0;overflow:hidden}
.card.warn{border-color:var(--warn-line)}
.card.danger{border-color:var(--danger-line)}
.sec-t{color:var(--fg-3);font-size:var(--size-xs);font-weight:500;margin-bottom:8px}
.kv{display:grid;grid-template-columns:minmax(96px,30%) 1fr;gap:6px 12px}
.kv dt{color:var(--fg-3);font-size:var(--size-sm)}
.kv dd{min-width:0;overflow-wrap:anywhere}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-control);background:var(--surface-2)}
.banner.warn{border-color:var(--warn-line)}.banner.warn>.ico{color:var(--warn)}
.banner.danger{border-color:var(--danger-line)}.banner.danger>.ico{color:var(--danger)}
.banner.ok>.ico{color:var(--ok)}
.banner .b{flex:1;min-width:0}
.banner b{font-weight:600}
.banner .row{margin-top:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:500}
.field input,.field select,.field textarea,.input{width:100%;min-height:40px;padding:8px 12px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-control);font-size:var(--size-input)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--fg);flex:none}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line-strong);border-radius:var(--r-control);text-align:left;width:100%}
.opt[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);z-index:60;max-width:min(440px,calc(100% - 32px));padding:10px 14px;background:var(--fg);color:var(--on-fg);border-radius:var(--r-control);box-shadow:var(--shadow);font-size:var(--size-sm)}
.overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:24px}
.sheet{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:var(--r-card);box-shadow:var(--shadow)}
.sheet-hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-hd h2{flex:1;font-size:var(--size-chat)}
.sheet-b{padding:16px;overflow-y:auto;flex:1;min-height:0}
.sheet-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}

/* Bot head: a tile cut from the mark's head, with the floating dot as its one living part. */
.head{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--h,32px);height:var(--h,32px);margin-top:6px;background:var(--surface-3);border:1px solid var(--line-strong);border-radius:calc(var(--h,32px)*.26);font-weight:600;font-size:calc(var(--h,32px)*.44);line-height:1}
.head i{position:absolute;left:50%;top:-8px;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.head[data-s=working] i{background:var(--fg);animation:breath var(--motion-breath) ease-in-out infinite}
.head[data-s=idle] i,.head[data-s=queued] i,.head[data-s=blocked] i,.head[data-s=stopping] i{box-shadow:inset 0 0 0 1.5px var(--fg-3)}
.head[data-s=waiting] i{background:var(--warn)}
.head[data-s=failed] i{background:var(--danger)}
.head[data-s=done] i{background:var(--ok)}
.jit-head{display:inline-flex;flex:none;width:var(--h,32px);height:var(--h,32px);margin-top:6px}
.jit-head svg{width:100%;height:100%;display:block}
.jit-head[data-s=working] .jit-dot{animation:breath var(--motion-breath) ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-1px)}}

/* Conversation */
.thread{display:flex;flex-direction:column;gap:20px}
.msg-owner{align-self:flex-end;max-width:85%;padding:10px 14px;background:var(--surface-2);border-radius:var(--r-card) var(--r-card) var(--r-tail) var(--r-card);font-size:var(--size-chat);line-height:1.7;overflow-wrap:anywhere}
.msg-bot{display:flex;gap:12px;align-items:flex-start}
.msg-bot .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;font-size:var(--size-chat);line-height:1.7}
.msg-who{font-size:var(--size-xs);color:var(--fg-3);line-height:1.4}
.owner-tag{align-self:flex-end;margin-top:-16px;color:var(--fg-3);font-size:var(--size-xs)}
.reply-chips{display:flex;flex-wrap:wrap;gap:8px}
.choice{padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:var(--size-sm);text-align:left}
.choice:hover{background:var(--surface-3)}
.composer{background:var(--surface-1);border:1px solid var(--line-strong);border-radius:var(--r-composer);padding:12px 12px 10px 16px}
.composer:focus-within{border-color:var(--fg)}
.composer textarea{display:block;width:100%;min-height:52px;resize:none;background:none;border:0;outline:0;font-size:var(--size-input);line-height:1.6}
.composer textarea::placeholder{color:var(--fg-3)}
.composer.big textarea{min-height:88px}
.composer-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.composer-bar .grow{flex:1}
.to-chip,.mode-chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:var(--size-sm);white-space:nowrap}
.mode-chip[aria-pressed=true]{background:var(--fg);color:var(--on-fg);border-color:var(--fg);font-weight:500}
.send{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--on-fg);flex:none}
.send:disabled{background:var(--surface-3);color:var(--fg-3)}
.comp-note{margin-top:8px;color:var(--fg-3);font-size:var(--size-xs);text-align:center}
.budget-line{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--fg-2);font-size:var(--size-xs)}

/* Home */
.home{display:flex;flex-direction:column;align-items:center;min-height:100%;padding:12vh 24px 32px;gap:12px}
.home>*{width:100%;max-width:var(--chat-w)}
.home-hello{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.home-hello h1{font-size:var(--size-xxl)}
.starter-list{display:flex;flex-direction:column}
.starter{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--fg-2);text-align:left;width:100%}
.starter:hover{color:var(--fg)}
.team-now{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bot-mini{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-control);text-align:left;min-width:0}
.bot-mini:hover{background:var(--surface-1)}
.bot-mini span{min-width:0}
.bot-mini b{display:block;font-weight:500}
.bot-mini small{display:block;color:var(--fg-3);font-size:var(--size-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Work card and lanes */
.workcard{border:1px solid var(--line-strong);border-radius:var(--r-card);overflow:hidden;background:var(--surface-1)}
.workcard-hd{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 8px}
.workcard-hd .t{flex:1;min-width:0}
.workcard-hd b{font-weight:600;display:block;line-height:1.4}
.lane-mini{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:var(--size-sm);line-height:1.4}
.lane-mini .head,.lane-mini .jit-head{--h:22px;margin-top:0}
.lane-mini .head i{top:-6px;width:4px;height:4px;margin-left:-2px}
.lane-mini .t{flex:1;min-width:0;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-mini .n{flex:none;font-weight:500}
.workcard-ft{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line);margin-top:6px}
.receipt{display:flex;flex-wrap:wrap;gap:2px 8px;padding:0 14px 8px;color:var(--fg-3);font-size:var(--size-xs)}
.lane{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-control);background:var(--bg)}
.lane .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lane .q{color:var(--fg-2);font-size:var(--size-xs)}
.lane .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* Timeline: thin marks, recessive axis, pattern encodes state without hue */
.tl{display:grid;grid-template-columns:72px 1fr;gap:6px 8px;align-items:center}
.tl-n{font-size:var(--size-xs);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:12px;border-radius:var(--r-tail);background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.tl-s{position:absolute;top:1px;bottom:1px;border-radius:var(--r-tail);min-width:4px}
.tl-s.run{background:var(--fg)}
.tl-s.queue{background:var(--bg);box-shadow:inset 0 0 0 1px var(--fg-3)}
.pane .tl-s.queue{background:var(--surface-1)}
.tl-s.wait{background:var(--hatch)}
.tl-s.fail{background:var(--danger)}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--fg-2)}
.tl-axis{grid-column:2;display:flex;justify-content:space-between;color:var(--fg-3);font-size:var(--size-xs)}
.tl-legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--fg-2);font-size:var(--size-xs);margin-top:10px}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.tl-legend i{width:18px;height:8px;border-radius:2px;position:relative;top:0}
.tl-legend i.run{background:var(--fg)}.tl-legend i.queue{box-shadow:inset 0 0 0 1px var(--fg-3)}.tl-legend i.wait{background:var(--hatch)}.tl-legend i.fail{background:var(--danger)}
.meter{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.meter .bar{grid-column:1/-1;height:6px;border-radius:var(--r-tail);background:var(--surface-3);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--fg);border-radius:var(--r-tail)}
.meter[data-unknown=true] .bar{background:var(--hatch);opacity:.6}
.meter small{color:var(--fg-2);font-size:var(--size-xs)}
table.t{font-size:var(--size-sm)}
table.t th{font-weight:500;color:var(--fg-3);text-align:left;font-size:var(--size-xs);padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
table.t td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
details>summary{cursor:pointer;color:var(--fg-2);font-size:var(--size-sm)}

/* Authority: only owner strips carry decisions */
.owner-strip{padding:12px 14px;background:var(--surface-2);border-top:1px solid var(--line-strong)}
.owner-strip .lbl{color:var(--fg-3);font-size:var(--size-xs);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.owner-strip .acts{display:flex;flex-wrap:wrap;gap:8px}
.untrusted{padding:10px 12px;border-left:2px solid var(--line-strong);background:var(--surface-2);border-radius:0 var(--r-control) var(--r-control) 0}
.untrusted .tag{color:var(--fg-3);font-size:var(--size-xs);margin-bottom:4px}
.slip{border:1px solid var(--warn-line);border-radius:var(--r-card);overflow:hidden;background:var(--surface-1)}
.slip[data-state=closed]{border-color:var(--line-strong)}
.slip[data-state=unknown]{border-color:var(--danger-line)}
.slip-hd{display:flex;gap:10px;align-items:flex-start;padding:12px 14px}
.slip-hd .t{flex:1;min-width:0}
.slip-hd b{display:block;font-weight:600}
.slip-exact{margin:0 14px 12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-control);font-family:var(--mono);font-size:var(--size-sm);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}

.diff-add,.diff-del{display:block;padding:2px 6px;border-radius:4px}

.diff-del{box-shadow:inset 2px 0 0 var(--danger);color:var(--fg-2);text-decoration:line-through}

.report{font-size:var(--size-chat);line-height:1.7}

.flag.danger{color:var(--danger);border-color:var(--danger-line)}
.cover{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--size-sm);padding:12px;border:1px solid var(--line);border-radius:var(--r-control);margin:12px 0}
.cover dt{white-space:nowrap}

.dl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-control)}

.ev .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.screen{border:1px solid var(--line-strong);border-radius:var(--r-card);overflow:hidden;background:var(--bg)}

.screen[data-driver=owner]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.fake-t{font-size:var(--size-lg);font-weight:600}
.fake-l{height:8px;border-radius:4px;background:var(--surface-3)}
.fake-in{height:30px;border-radius:6px;border:1px solid var(--line-strong);padding:5px 8px;color:var(--fg-3);font-size:var(--size-xs);background:var(--bg)}
.fake-b{align-self:flex-start;padding:4px 14px;border-radius:6px;background:var(--surface-3);font-size:var(--size-xs)}
.cursor{position:absolute;display:flex;align-items:center;gap:4px;font-size:var(--size-xs);padding:1px 6px;border-radius:var(--r-pill);background:var(--fg);color:var(--on-fg)}
.lease{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-control)}

.lease[data-driver=owner]{border-color:var(--fg);background:var(--surface-2)}
.steps-log li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:var(--size-sm)}
.steps-log time{flex:none;color:var(--fg-3);font-size:var(--size-xs);width:44px;padding-top:1px}

.setup-steps li{flex:1;min-width:0;padding-top:8px;border-top:2px solid var(--line-strong);color:var(--fg-3);font-size:var(--size-xs);overflow-wrap:break-word}
.setup-steps li[data-s=current]{border-top-color:var(--fg);color:var(--fg);font-weight:500}
.setup-steps li[data-s=done]{border-top-color:var(--fg-3);color:var(--fg-2)}
.setup-card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.ready li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ready li>.ico{margin-top:2px}
.ready .b{flex:1;min-width:0}
.ready .ok{color:var(--ok)}.ready .warn{color:var(--warn)}.ready .danger{color:var(--danger)}
.code{font-family:var(--mono);font-size:var(--size-xl);letter-spacing:.14em;text-align:center;padding:12px;border:1px dashed var(--line-strong);border-radius:var(--r-control)}

.ceremony svg{width:96px;height:96px}
.ceremony[data-play=true] .jit-halo{stroke-dasharray:62;stroke-dashoffset:62;animation:halo var(--motion-ceremony) ease-out forwards}
.ceremony[data-play=true] .jit-dot{animation:rise var(--motion-ceremony) ease-out forwards}

.work-row .b{flex:1;min-width:0}

}

    paneFrom = document.activeElement;
    paneFromSelector = paneFrom?.dataset?.act ? `[data-act="${paneFrom.dataset.act}"][data-arg="${CSS.escape(paneFrom.dataset.arg || "")}"]` : null;
  }
  const root = document.documentElement; root.lang = S.lang; root.dataset.theme = S.theme;
  document.title = T("ต้นแบบ Jit S14 · ข้อมูลจำลอง", "Jit S14 prototype · fixture data");
  const chrome = $("#chrome"), app = $("#app");
  patch(chrome, chromeView()); chrome.setAttribute("aria-label", T("ตัวควบคุมต้นแบบ", "Prototype controls"));
  $("#scene").value = S.scene;
  $("#stage").dataset.device = S.device;
  patch(app, appView());
  app.dataset.pane = S.pane ? "open" : "closed"; app.dataset.thread = String(S.route === "chat");
  const d = $("#draft"); if (d && d.value !== S.draft) d.value = S.draft;
  const covered = S.pane && $("#viewport").clientWidth < 1040;
  $("#app .main")?.toggleAttribute("inert", !!covered || !!S.modal); $("#app .nav")?.toggleAttribute("inert", !!covered || !!S.modal); const p = $("#app .pane"); if (p) p.toggleAttribute("inert", !!S.modal);
  if (p) { p.setAttribute("role", covered ? "dialog" : "complementary"); p.toggleAttribute("aria-modal", !!covered); if (covered) p.setAttribute("aria-modal", "true"); p.tabIndex = -1; }
  if (covered && !S.modal && (!wasOverlay || hadModal || document.activeElement?.closest("[inert]"))) requestAnimationFrame(() => {
    const current = $("#app .pane"); if (current && S.pane && !S.modal && !current.contains(document.activeElement)) (focusable(current)[0] || current).focus();
  });
  if (hadPane && !S.pane) {
    const from = paneFrom, selector = paneFromSelector;
    requestAnimationFrame(() => {
      const target = from?.isConnected && !from.closest("[inert]") && (!selector || from.matches(selector)) ? from : selector && $("#app " + selector);
      (target || $("#main"))?.focus();
    });
    paneFrom = null; paneFromSelector = null;
  }
  hadPane = !!S.pane; wasOverlay = !!covered; hadModal = !!S.modal;
  if (S.route === "chat" && S.conv === "research") { const st = workState(); if (st !== lastState) { if (lastState) say(T("สถานะงาน: ", "Work state: ") + T(STATE[st][1], STATE[st][2])); lastState = st; } } else lastState = null;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.tagName === "A") e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) { fn(el.dataset.arg ?? ""); if (S.scene) render(); }
});
document.addEventListener("input", e => { if (e.target.dataset?.bind === "draft") { S.draft = e.target.value; const b = e.target.form?.querySelector(".send"); if (b) b.disabled = !S.draft.trim(); } });
document.addEventListener("change", e => {
  if (e.target.dataset?.change === "scene") setScene(e.target.value);
  if (e.target.id === "sh1") S.shareDraft.receiver = e.target.value;
  if (e.target.id === "sh2") S.shareDraft.scope = e.target.value;
});
document.addEventListener("submit", e => { e.preventDefault(); send(); });
function send() {
  const text = S.draft.trim(); if (!text) return;
  if (S.route === "chat") { S.draft = ""; toast(T("ต้นแบบ: ข้อความนี้จะขึ้นสถานะรอคิว แล้วตอบตามลำดับ", "Prototype: this message would show Queued, then be answered in order")); return; }
  if (S.target !== "jit") { const t = S.target; reset(); Object.assign(S, { scene: "task", route: "chat", conv: "direct", target: t }); render(); return; }
  if (S.workMode) { startResearch(text); return; }
  const f = S.firstRun; reset(); Object.assign(S, { scene: "ask", firstRun: f, route: "chat", conv: "ask", request: text }); render(); syncHash(); focusMain();
}
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); ACT.modal("palette"); render(); return; }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "draft") { e.preventDefault(); send(); return; }
  if (e.key === "Escape") { if (S.modal) { ACT.closeModal(); render(); } else if (S.pane) { S.pane = null; render(); } return; }
  if (!typing && e.key === "]") step(1);
  if (!typing && e.key === "[") step(-1);
  if (e.target.getAttribute?.("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const tabs = [...e.target.parentElement.querySelectorAll('[role="tab"]')], i = tabs.indexOf(e.target), n = tabs[(i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
    n.click(); requestAnimationFrame(() => n.focus()); e.preventDefault();
  }
  if (e.key === "Tab" && (S.modal || wasOverlay)) {
    const sh = $(S.modal ? "#app .sheet" : "#app .pane"); if (!sh) return; const f = focusable(sh); if (!f.length) { sh.focus(); e.preventDefault(); return; }
    if (!sh.contains(document.activeElement)) { (e.shiftKey ? f[f.length - 1] : f[0]).focus(); e.preventDefault(); return; }
    if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); }
  }
});
document.addEventListener("mousedown", e => { if (e.target.dataset?.overlay) { ACT.closeModal(); render(); } });
simTimer = setInterval(() => { if (S.playing && S.beat < 7 && !S.fault) { S.beat++; if (S.beat >= 7) S.playing = false; render(); } }, 2400);
if (window.ResizeObserver) new ResizeObserver(() => render()).observe($("#viewport"));
(function init() {
  let p = new URLSearchParams(""); try { p = new URLSearchParams(location.hash.slice(1)); } catch (e) { /* sandboxed preview */ }
  if (p.get("lang") === "en") S.lang = "en";
  if (p.get("theme") === "light") S.theme = "light";
  if (["tablet", "mobile"].includes(p.get("device"))) S.device = p.get("device");
  setScene(p.get("scene") || "first");
})();
