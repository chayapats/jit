<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ต้นแบบ Jit S15 · ข้อมูลจำลอง</title>
<!--
  S15 conversational experience prototype (UX15-00, #337).
  Self-contained review artifact: fixture data only, no network, no storage, no real accounts.
  Inline CSS here is for review only and is not production CSS precedent (NFR-13).
  See docs/design/S15-conversational-experience.md for the authoritative handoff.
-->
<style>
:root{--bg:#0a0a0a;--surface-1:#141414;--surface-2:#1c1c1c;--surface-3:#262626;--line:#262626;--fg:#ededed;--fg-2:#a3a3a3;--fg-3:#8a8a8a;--on-fg:#0a0a0a;--ok:#86efac;--warn:#fde047;--danger:#fca5a5;--line-strong:color-mix(in srgb,var(--fg) 28%,transparent)}
[data-theme=light]{--bg:#fafaf9;--surface-1:#fff;--surface-2:#f4f4f3;--surface-3:#ebebea;--line:#e7e7e5;--fg:#0a0a0a;--fg-2:#525252;--fg-3:#6b6b6b;--on-fg:#fafaf9;--ok:#15803d;--warn:#8f5706;--danger:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Leelawadee UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
a{color:inherit}
.proto{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--surface-1);border-bottom:1px solid var(--line)}
.proto b{font-weight:600}
.proto .tag{border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:1px 10px;font-size:12px}
.proto select,.proto button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.proto button[aria-pressed=true]{background:var(--fg);color:var(--on-fg)}
.frame{display:flex;min-height:calc(100vh - 50px);margin:0 auto;max-width:1400px}
.frame.mobile{max-width:390px;border-inline:1px solid var(--line)}
.nav{width:248px;flex:none;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.frame.mobile .nav{display:none}
.mark{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;margin-bottom:12px}
.mark svg{width:28px;height:28px}
.nl{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--fg-2)}
.nl[aria-current]{background:var(--surface-2);color:var(--fg)}
.nl .n{border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:0 7px;font-size:12px}
.sec{color:var(--fg-3);font-size:12px;margin:12px 10px 2px}
.main{flex:1;display:flex;min-width:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.hdr h1{font-size:15px;font-weight:600;margin:0;flex:1}
.needs{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;text-decoration:none}
.needs.on{border-color:var(--warn);color:var(--warn)}
.scroll{flex:1;overflow:auto;padding:20px}
.thread{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.owner{border-left:2px solid var(--line-strong);padding:2px 0 2px 12px;color:var(--fg);white-space:pre-wrap}
.meta{color:var(--fg-3);font-size:12px}
.line{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg-2)}
.pill{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line-strong);border-radius:999px;padding:0 9px;font-size:12px;white-space:nowrap}
.pill.warn{border-color:var(--warn);color:var(--warn)}.pill.ok{border-color:var(--ok);color:var(--ok)}.pill.danger{border-color:var(--danger);color:var(--danger)}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface-1);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card h2,.card h3{margin:0;font-size:15px;font-weight:600}
.card-hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--fg-2)}
.untrusted{border-left:2px solid var(--line-strong);background:var(--surface-2);padding:8px 12px;border-radius:0 8px 8px 0}
.untrusted .lab{font-size:11px;color:var(--fg-3);margin-bottom:4px}
.exact-l{font-size:12px;color:var(--fg-3);margin:0 0 2px}
pre.exact{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.55 ui-monospace,"JetBrains Mono",Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
.kv dt{color:var(--fg-3)}.kv dd{margin:0}
.strip{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.strip-l{font-size:12px;color:var(--fg-3);display:flex;gap:6px;align-items:center}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.frame.mobile .acts{flex-direction:column}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.quiet{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{color:var(--fg-3);font-size:12px;margin:0}
.prog{border:1px dashed var(--line-strong);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.prog .hd{font-size:12px;color:var(--fg-3)}
.ev{display:flex;gap:6px}.ev .ok{color:var(--ok)}
code,.mono{font-family:ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--fg-3);font-weight:500}
.composer{border-top:1px solid var(--line);padding:12px 20px}
.composer form{max-width:720px;margin:0 auto;border:1px solid var(--line);border-radius:24px;background:var(--surface-2);padding:8px 10px 8px 16px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;background:none;border:0;resize:none;min-height:24px;outline:none}
.composer .to{font-size:12px;color:var(--fg-3);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.send{background:var(--fg);color:var(--on-fg);border:0;border-radius:999px;width:32px;height:32px;cursor:pointer}
.pane{width:400px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--bg)}
.frame.mobile .pane{position:fixed;inset:50px 0 0;width:auto;max-width:390px;margin:0 auto;z-index:4}
.pane-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pane-hd h2{margin:0;font-size:15px}
.setup{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.step-n{display:inline-flex;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);align-items:center;justify-content:center;font-size:12px;margin-right:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frame.mobile .two{grid-template-columns:1fr}
ul.plain{margin:0;padding-left:18px}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex}
.meter i{display:block;background:var(--fg)}
.meter i.unk{background:repeating-linear-gradient(45deg,var(--fg-3) 0 3px,transparent 3px 6px)}
.shot{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);height:150px;display:flex;align-items:center;justify-content:center;color:var(--fg-3)}
.banner{border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px}
.banner.warn{border-color:var(--warn)}.banner.ok{border-color:var(--ok)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Prototype controls">
  <span class="tag" id="ptag">ต้นแบบ · ข้อมูลจำลอง</span>
  <label><span class="sr" id="lscene">Scene</span><select id="scene" aria-labelledby="lscene"></select></label>
  <button type="button" id="lang-th" aria-pressed="true">ไทย</button><button type="button" id="lang-en" aria-pressed="false">English</button>
  <button type="button" id="theme" aria-pressed="false">Light</button>
  <button type="button" id="width" aria-pressed="false">Mobile 390</button>
</div>
<div class="frame" id="frame"></div>
<p class="sr" role="status" aria-live="polite" id="live"></p>
<script>
"use strict";
let lang = "th", scene = "chat", st = {};
const L = (th, en) => lang === "th" ? th : en;
const esc = v => String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pill = (label, tone = "", glyph = "") => `<span class="pill ${tone}">${glyph ? `<span aria-hidden="true">${glyph}</span>` : ""}${esc(label)}</span>`;
const untrusted = (label, body) => `<div class="untrusted"><div class="lab">${esc(label)}</div>${body}</div>`;
const exact = (label, text) => `<div><p class="exact-l">${esc(label)}</p><pre class="exact">${esc(text)}</pre></div>`;
const strip = (acts, note) => `<div class="strip"><div class="strip-l"><span aria-hidden="true">🔒</span>${L("ส่วนที่คุณตัดสินใจ", "Your decision")}</div><div class="acts">${acts}</div>${note ? `<p class="note">${esc(note)}</p>` : ""}</div>`;
const btn = (label, act, cls = "", extra = "") => `<button type="button" class="btn ${cls}" data-act="${act}" ${extra}>${esc(label)}</button>`;
const announce = text => { const el = document.getElementById("live"); el.textContent = ""; setTimeout(() => { el.textContent = text; }, 30); };
const fixtureNote = () => `<p class="note">${L("ปุ่มในต้นแบบเปลี่ยนเฉพาะการแสดงผลในหน้านี้ ไม่ส่งอะไรจริง", "Prototype buttons only change this page's display. Nothing is sent.")}</p>`;
const owner = text => `<div class="owner">${esc(text)}</div><div class="line">${pill(L("ได้รับแล้ว", "Received"))}<span class="meta">10:42</span></div>`;
const intent = (text, extra = "") => `<div class="line"><span aria-hidden="true">→</span><span>${esc(text)}</span>${extra}</div>`;
const prog = items => `<div class="prog"><div class="hd">${L("ความคืบหน้า (ยังไม่ใช่หลักฐาน)", "Progress (not evidence yet)")}</div>${items.map(([text, saved]) => `<div class="ev">${saved ? `<span class="ok" aria-hidden="true">✓</span>` : `<span aria-hidden="true">·</span>`}<span>${text}</span>${saved ? `<span class="meta">${L("บันทึกแล้ว", "Saved")}</span>` : ""}</div>`).join("")}</div>`;
const footer = (memory = true) => `<details><summary class="meta">${L("ตอบด้วย โมเดล A (ตัวอย่าง) · คิด: สูง", "Answered with Model A (example) · thinking: high")}</summary><p class="note">${L("เลือกเพราะ: งานซับซ้อน (ในรายการที่คุณอนุมัติ) · ผู้ให้บริการไม่ยืนยันว่าใช้ระดับความคิดนี้", "Chosen because: complex task (from your approved list) · The provider doesn't confirm it used this thinking level")}</p></details>${memory ? `<details><summary class="meta">${L("จำไว้ 1 เรื่อง", "Remembered 1 thing")}</summary><div class="row"><span>${L("คุณใช้ Bun รัน test ใน repo นี้", "You run tests in this repo with Bun")}</span>${pill(L("ข้อเท็จจริง", "Fact"))}<span class="meta">${L("จากข้อความนี้", "From this message")}</span>${btn(L("แก้", "Correct"), "noop", "quiet")}${btn(L("ลืม", "Forget"), "noop", "quiet")}</div></details>` : ""}`;

/* ---------- Scenes ---------- */
const scenes = {
  setup: { t: ["ตั้งค่าครั้งแรก", "First-run setup"], nav: "", render() {
    const checked = st.vmChecked, used = st.vmUsed, budget = (st.budget || "").trim();
    const cap = (th, en, state) => `<li class="row">${state === "ok" ? pill(L("ตรวจแล้ว", "Observed"), "ok", "✓") : state === "no" ? pill(L("ทำไม่ได้", "Not available"), "", "×") : pill(L("ยังไม่ได้ตรวจ", "Not checked yet"))}<span>${esc(L(th, en))}</span></li>`;
    return `<div class="setup"><h2 style="margin:0">${L("ตั้งค่าจิต", "Set up Jit")}</h2><p class="note">${L("ทำทีละส่วน ข้ามส่วนที่ไม่บังคับได้ จิตเดาค่าที่เดาได้ให้หมด", "One section at a time. Optional ones can be skipped. Jit fills in everything it can infer.")}</p>
    <section class="card" aria-labelledby="s1"><div class="card-hd"><h3 id="s1"><span class="step-n">1</span>${L("ตั้งรหัสผ่าน", "Password")}</h3>${pill(L("เสร็จ", "Done"), "ok", "✓")}</div></section>
    <section class="card" aria-labelledby="s2"><div class="card-hd"><h3 id="s2"><span class="step-n">2</span>${L("บัญชีโมเดล", "Model account")}</h3>${pill(L("เชื่อมแล้ว ยังไม่ได้ลองใช้จริง", "Connected, not tried yet"))}</div><p class="note">${L("ผู้ให้บริการ A (ตัวอย่าง) · การเชื่อมไม่ได้พิสูจน์ว่าใช้ได้ คำตอบแรกจะบอก", "Provider A (example) · Connected doesn't prove it works. The first reply will tell.")}</p></section>
    <section class="card" aria-labelledby="s3"><div class="card-hd"><h3 id="s3"><span class="step-n">3</span>${L("เครื่องทำงาน", "Working computer")}</h3>${used ? pill(L("ใช้เครื่องนี้แล้ว", "In use"), "ok", "✓") : pill(L("ยังไม่เชื่อม", "Not connected"), "warn", "!")}</div>
      <p>${L("สร้าง VM ใหม่ที่จิตใช้ได้เต็มที่ (แนะนำ Ubuntu) แล้ววางบรรทัดนี้ในเครื่องนั้นครั้งเดียว", "Create a new VM that Jit can fully use (Ubuntu recommended), then paste this line into it once.")}</p>
      ${exact(L("วางบรรทัดนี้ในเครื่องใหม่ครั้งเดียว", "Paste this line into the new machine once"), "echo 'ssh-ed25519 AAAAC3Nz…(fixture) jit-work' | sudo tee -a /root/.ssh/authorized_keys")}
      <div class="row">${btn(L("คัดลอก", "Copy"), "noop")}<span class="note">${L("บรรทัดนี้มีแค่กุญแจสาธารณะ ไม่ดึงอะไรจากจิต", "This line holds only a public key. It fetches nothing from Jit.")}</span></div>
      <div class="field"><label for="vmaddr">${L("ที่อยู่ของเครื่อง", "Machine address")}</label><input id="vmaddr" value="${esc(st.vmaddr || "")}" placeholder="jit-work.local" autocomplete="off"></div>
      <div class="row">${btn(L("ตรวจเครื่อง", "Check the machine"), "vm-check", "primary")}<details><summary class="meta">${L("รายละเอียด", "Details")}</summary><p class="note">${L("พอร์ตและผู้ใช้ใช้ค่ามาตรฐาน ไม่ต้องกรอก", "Port and user use the standard values. Nothing to fill in.")}</p></details></div>
      ${checked ? `<div class="banner"><dl class="kv"><dt>${L("ลายนิ้วมือเครื่อง", "Machine fingerprint")}</dt><dd class="mono">SHA256:Qx3…(fixture)</dd><dt>${L("เครื่อง", "Machine")}</dt><dd>Ubuntu 24.04 · x64 · 4 CPU · 8 GB · 60 GB</dd></dl>
        <ul class="plain" style="list-style:none;padding:0;display:flex;flex-direction:column;gap:4px;margin-top:8px">${cap("รันคำสั่ง", "Run commands", "ok")}${cap("ผู้ดูแลระบบ (sudo)", "Administrator (sudo)", "ok")}${cap("Docker", "Docker", "ok")}${cap("เน็ตสำหรับติดตั้งแพ็กเกจ", "Network for packages", "")}${cap("Snapshot และย้อนเครื่อง", "Snapshots and restore", st.noSnap ? "no" : "")}</ul>
        ${st.noSnap ? `<p class="note">${L("จิตย้อนเครื่องเองไม่ได้ ใช้ snapshot ใน Proxmox แล้วกด ตรวจเครื่อง อีกครั้ง", "Jit can't restore this machine itself. Use a snapshot in Proxmox, then press Check the machine again.")}</p>` : ""}
        <p>${L("จิตมีสิทธิ์เต็มในเครื่องนี้ ข้อมูลสำคัญ รหัสผ่าน และการส่งออกไปข้างนอกอยู่นอกเครื่องนี้เสมอ ถ้าเครื่องพัง ย้อนกลับจาก snapshot ได้", "Jit has full control of this machine. Your important data, passwords and anything that leaves for the outside world stay outside it. If it breaks, it can be restored from a snapshot.")}</p>
        <div class="row">${btn(L("ใช้เครื่องนี้เป็นเครื่องทำงาน", "Use this as the working computer"), "vm-use", "primary", used ? "disabled" : "")}${btn(L("สลับ: ไม่มี snapshot", "Toggle: no snapshot"), "vm-nosnap", "quiet")}</div></div>` : ""}
    </section>
    <section class="card" aria-labelledby="s4"><div class="card-hd"><h3 id="s4"><span class="step-n">4</span>${L("บัญชีและเว็บ", "Accounts and websites")}</h3>${pill(L("ไม่บังคับ", "Optional"))}</div><div class="row">${btn(L("เชื่อม Google", "Connect Google"), "noop")}${btn(L("เชื่อม GitHub", "Connect GitHub"), "noop")}${btn(L("ข้ามไปก่อน", "Skip for now"), "noop", "quiet")}</div><p class="note">${L("บัญชีที่เชื่อมใช้ได้ทั้งทีมในงานที่คุณขอ จำกัดเฉพาะบอทได้ภายหลัง", "Connected accounts work for the whole team in the work you ask for. You can limit them to specific Bots later.")}</p></section>
    <section class="card" aria-labelledby="s5"><div class="card-hd"><h3 id="s5"><span class="step-n">5</span>${L("กฎประจำและงบ", "Rules and budget")}</h3></div>
      <div class="two"><div><h4 style="margin:0 0 4px">${L("จิตทำเองได้", "Jit does these on its own")}</h4><ul class="plain"><li>${L("ตอบ ค้นหา และทำรายงาน", "Answer, search and write reports")}</li><li>${L("ทำงานบนเครื่องทำงาน รวมถึงติดตั้งโปรแกรม", "Work on its working computer, including installing programs")}</li><li>${L("แก้เอกสาร งาน และนัดส่วนตัวที่ไม่มีคนอื่น เมื่อคุณขอ", "Edit your documents, tasks and solo calendar blocks when you ask")}</li><li>${L("ใช้บัญชีที่เชื่อมไว้กับงานที่คุณขอ", "Use connected accounts for the work you ask for")}</li><li>${L("เลือกโมเดลในรายการที่อนุมัติ", "Pick a model from the approved list")}</li></ul></div>
      <div><h4 style="margin:0 0 4px">${L("ถามคุณก่อนเสมอ", "Always asks you first")}</h4><ul class="plain"><li>${L("ส่งอีเมลหรือข้อความถึงคนอื่น", "Sending email or messages to other people")}</li><li>${L("GitHub: push, PR และตอบรีวิว", "GitHub: push, pull requests and review replies")}</li><li>${L("Merge และ deploy production", "Merging and production deploys")}</li><li>${L("จ่ายเงิน", "Payments")}</li><li>${L("ส่งข้อมูลส่วนตัวให้ผู้รับใหม่", "Giving private data to a new recipient")}</li><li>${L("การเปลี่ยนแปลงใหญ่หรือย้อนยาก", "Major or hard-to-undo changes")}</li><li>${L("ผู้ให้บริการ บัญชี หรืองบใหม่", "New providers, accounts or bigger budgets")}</li></ul></div></div>

    st.stall = act.slice(6); render();
    restoreFocus({ asking: "#stall-way", stopping: '[data-act="stall:stopped"]', paused: '[data-act="stall:resumed"]' }[st.stall], "#main");
    announce({ resumed: L("ทำต่อแล้ว", "Resumed"), owner_way: L("ทำต่อตามวิธีของคุณ", "Resumed with your approach"), asking: L("พิมพ์วิธีที่อยากให้ลอง", "Type the approach to try"), stopping: L("สั่งหยุดแล้ว", "Stop requested"), stopped: L("หยุดแล้ว", "Stopped"), paused: L("หยุดพักไว้", "Paused") }[st.stall]);
    return;
  }
  if (act === "duty:stop") { st.dutyStop = true; render(); restoreFocus(again); announce(L("สั่งหยุดแล้ว", "Stop requested")); return; }
  if (act === "mem:forget") { st.forget = true; render(); restoreFocus("#fg ~ .acts .btn:last-child"); return; }
  if (act === "mem:close") { st.forget = false; render(); restoreFocus('[data-act="mem:forget"]'); return; }
});
render();
</script>
</body>
</html>
