# journald namespace for the Jit unit (LogNamespace=jit), rendered by the
# operator commands. Bounds persisted log size and retention.
[Journal]
Storage=persistent
SystemMaxUse={{LOG_BYTES}}
SystemMaxFileSize={{LOG_FILE_BYTES}}
MaxRetentionSec={{RETENTION_DAYS}}day
RateLimitIntervalSec=30s
RateLimitBurst=1000
