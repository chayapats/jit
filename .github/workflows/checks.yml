name: checks
# Cost guard: one run per PR head (no duplicate push+pull_request runs), drafts and
# docs-only changes skip CI, and a newer push cancels the older run. Merges to main are
# already tested on the PR merge ref; run manually with workflow_dispatch when needed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deterministic:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # Fake-runtime parser fixtures use local Pillow/Poppler; no image is built and no Podman is run.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ripgrep python3-pil poppler-utils
      - run: bun run typecheck
      # Full-suite parallel load on a shared runner exceeds Bun's default 5 s per test.
      - run: bun test --timeout 30000
        env:
          JIT_TEST_PYTHON: /usr/bin/python3
