name: checks
# Six shards keep a full run near four minutes, and they run on both x64 (ubuntu-latest) and
# ARM64 (ubuntu-24.04-arm) because Jit targets any 64-bit Linux. Both runner types are free for
# this public repository. Cost guard: one run per PR head (no duplicate push+pull_request runs), drafts and
# docs-only changes skip CI, and a newer push cancels the older run. Merges to main are
# already tested on the PR merge ref; run manually with workflow_dispatch when needed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
  tests:
    name: tests (${{ matrix.arch }}, ${{ matrix.shard }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # Fake-runtime parser fixtures use local Pillow/Poppler; no image is built and no Podman is run.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ripgrep python3-pil poppler-utils
      # A shared runner under parallel load can exceed Bun's default 5 s per test.
      - run: bun test --timeout 30000 $(bun ops/ci/test-shard.ts ${{ matrix.shard }} 6)
        env:
          JIT_TEST_PYTHON: /usr/bin/python3
  # Fails when typecheck or any shard on either architecture did not succeed.
  deterministic:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [typecheck, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.typecheck.result }}" = success && test "${{ needs.tests.result }}" = success
